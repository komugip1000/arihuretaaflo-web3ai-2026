<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Prioritizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>AI Task Prioritizer</h1>
            <p class="subtitle">「後でやろう」をなくす、魔法のタスク管理</p>
        </header>

        <main>
            <!-- 1番やるべきことハイライト表示エリア -->
            <section id="focus-area" class="focus-area hidden">
                <h2>✨ 今すぐやるべきタスク ✨</h2>
                <div id="primary-task" class="primary-task-card">
                    <!-- JSでタスク名が挿入される -->
                </div>
                <button id="complete-primary-btn" class="btn primary-action">完了して次へ</button>
            </section>

            <!-- タスク入力エリア -->
            <section class="input-section">
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="例：明日までに〇〇を提出する" autocomplete="off">
                    <button type="submit" class="btn add-btn">+</button>
                </form>
                <div class="input-hints">
                    <p class="hint-text">💡 短い文章でOK！「今日」「至急」などを入れるとAIが優先度を判定しやすくなります。</p>
                    <div class="quick-adds">
                        <button type="button" class="quick-tag">今日中にメール返信</button>
                        <button type="button" class="quick-tag">至急電話する</button>
                        <button type="button" class="quick-tag">明日までに資料作成</button>
                    </div>
                </div>
            </section>

            <!-- アクションエリア -->
            <section class="action-section">
                <button id="ai-sort-btn" class="btn magic-btn" disabled>
                    <span class="magic-icon">🪄</span> AIにお任せ整理
                </button>
            </section>

            <!-- タスクリスト -->
            <section class="list-section">
                <h3>溜まっているタスク <span id="task-count" class="badge">0</span></h3>
                <ul id="task-list" class="task-list">
                    <!-- JSでタスクが追加される -->
                </ul>
            </section>
        </main>
    </div>

    <script src="app.js"></script>

    <!-- 完了時のご褒美トースト -->
    <div id="celebration-toast" class="toast hidden">
        🎉 お疲れ様！その調子！
    </div>
</body>
</html>
